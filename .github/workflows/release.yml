name: Release

# Fires only on an explicit tag push (e.g. `git tag v0.4.0 && git push origin v0.4.0`),
# never on an ordinary merge to main - cutting a release stays a deliberate act, and
# the maintainer is expected to have already written the matching CHANGELOG.md
# section and completed physical-device acceptance (see docs/release-checklist.md)
# before pushing the tag.
#
# This only automates the firmware-only assets: a versioned copy of each device's
# firmware (xteink-pokemon-x3-x4-firmware-v<version>.bin,
# xteink-pokemon-x4-pro-firmware-v<version>.bin), a version-less "-latest.bin" alias
# of each (so README.md/docs/installation.md can link straight to
# .../releases/latest/download/<alias-name> and always get the current build), and
# SHA256SUMS.txt. The full-install ZIP needs the Pokemon artwork pack, which is
# deliberately not committed to this repository (see docs/release-checklist.md) -
# build and upload it to the same release by hand with
# scripts/package_pokemon_v2_release.py when needed, same as before.
#
# Also uploads each firmware unrenamed (firmware-x3-x4.bin, firmware-x4-pro.bin) -
# src/network/OtaUpdater.cpp's isMatchingFirmwareAssetName() only accepts an asset
# literally named "firmware-<CROSSINK_FIRMWARE_DEVICE_TYPE>.bin" (or that stem plus
# "-<anything>.bin") when scanning the GitHub Releases API for the device's own
# in-app "Check for Update" over Wi-Fi. None of the public xteink-pokemon-* names
# match that, so OTA would otherwise silently find no compatible asset.
#
# Each firmware builds in its OWN job (its own runner/VM), matching ci.yml's
# per-environment matrix - a first (cold-cache) run of this workflow found that
# building both pokemon-x3 (ESP32-C3/riscv32 toolchain) and pokemon-x4-pro
# (ESP32-S3/xtensa toolchain, plus a much larger Arduino-ESP32 libs bundle) inside
# ONE job/runner exhausted the runner's disk mid-build, silently losing the first
# build's output before the packaging step ran. Splitting into separate jobs gives
# each build its own disk budget, same as ci.yml already does successfully.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-x3-x4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-release-pokemon-x3-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build pokemon-x3 (X3/X4) firmware
        env:
          # Bakes this release's own version into CROSSINK_VERSION (see
          # scripts/git_branch.py) so the device's Wi-Fi "Check for Update"
          # can actually compare against future release tags. Without this,
          # the build falls back to a dev version and never detects updates.
          CROSSINK_RELEASE_VERSION: ${{ github.ref_name }}
        run: pio run -e pokemon-x3

      - name: Verify build output
        run: test -s .pio/build/pokemon-x3/firmware-x3-x4.bin

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-x3-x4
          path: .pio/build/pokemon-x3/firmware-x3-x4.bin
          if-no-files-found: error

  build-x4-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-release-pokemon-x4-pro-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build pokemon-x4-pro firmware
        env:
          # See the matching comment on the pokemon-x3 build step above.
          CROSSINK_RELEASE_VERSION: ${{ github.ref_name }}
        run: pio run -e pokemon-x4-pro

      - name: Verify build output
        run: test -s .pio/build/pokemon-x4-pro/firmware-x4-pro.bin

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-x4-pro
          path: .pio/build/pokemon-x4-pro/firmware-x4-pro.bin
          if-no-files-found: error

  release:
    needs: [build-x3-x4, build-x4-pro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: firmware-x3-x4
          path: build/pokemon-x3

      - uses: actions/download-artifact@v7
        with:
          name: firmware-x4-pro
          path: build/pokemon-x4-pro

      - name: Package firmware assets
        id: package
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          x3_x4_src=build/pokemon-x3/firmware-x3-x4.bin
          x4_pro_src=build/pokemon-x4-pro/firmware-x4-pro.bin
          for src in "$x3_x4_src" "$x4_pro_src"; do
            if [ ! -f "$src" ]; then
              echo "::error::expected downloaded artifact missing: $src"
              ls -la "$(dirname "$src")" || true
              exit 1
            fi
          done

          cp "$x3_x4_src" "dist/xteink-pokemon-x3-x4-firmware-v${version}.bin"
          cp "$x4_pro_src" "dist/xteink-pokemon-x4-pro-firmware-v${version}.bin"

          # Version-less alias copies of the same two files. Every release
          # (this workflow always runs on a real version tag) re-uploads
          # these under the exact same fixed name, so
          # /releases/latest/download/<alias-name> always resolves to
          # whatever this workflow most recently published - the stable
          # per-device links in README.md/docs/installation.md rely on this.
          cp "$x3_x4_src" dist/xteink-pokemon-x3-x4-firmware-latest.bin
          cp "$x4_pro_src" dist/xteink-pokemon-x4-pro-firmware-latest.bin

          # Unrenamed copies too, under the exact name
          # src/network/OtaUpdater.cpp's isMatchingFirmwareAssetName() looks for
          # (see the comment at the top of this file) - required for the
          # device's own "Check for Update" over Wi-Fi to find this release.
          cp "$x3_x4_src" dist/firmware-x3-x4.bin
          cp "$x4_pro_src" dist/firmware-x4-pro.bin

          (cd dist && sha256sum ./*.bin | sed 's#\./##' > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          set -euo pipefail
          python3 scripts/extract_changelog_section.py \
            --changelog CHANGELOG.md \
            --version "${{ steps.package.outputs.version }}" \
            > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            "dist/xteink-pokemon-x3-x4-firmware-v${{ steps.package.outputs.version }}.bin" \
            "dist/xteink-pokemon-x4-pro-firmware-v${{ steps.package.outputs.version }}.bin" \
            dist/xteink-pokemon-x3-x4-firmware-latest.bin \
            dist/xteink-pokemon-x4-pro-firmware-latest.bin \
            dist/firmware-x3-x4.bin \
            dist/firmware-x4-pro.bin \
            dist/SHA256SUMS.txt \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
